# SonarQube Cloud analysis (workflow .github/workflows/sonarcloud.yml). The organization and project key are the
# ones SonarQube Cloud picks when the repository is imported from GitHub.
sonar.organization=liehrdot
sonar.projectKey=liehrdot_Conclave
sonar.projectName=Conclave

sonar.sources=src,desktop
sonar.tests=tests
# Vendored libraries, fonts and generated Tauri files are not ours to fix.
sonar.exclusions=src/mtgdeck/gui/static/vendor/**,src/mtgdeck/sync/app/vendor/**,**/fonts/**,desktop/src-tauri/gen/**,desktop/src-tauri/target/**,desktop/src-tauri/icons/**

sonar.python.version=3.11,3.12
sonar.python.coverage.reportPaths=coverage.xml
# Only the Python code has tests that measure coverage; the GUI, the phone app and the Tauri shell are checked
# with Playwright scripts and CI builds instead, so they stay out of the coverage condition.
sonar.coverage.exclusions=**/*.js,**/*.mjs,**/*.html,**/*.css,**/*.rs,desktop/**,deploy/**,scripts/**
