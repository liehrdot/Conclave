[project]
name = "mtgdeck"
version = "0.1.9"
description = "Commander deckbuilder: a local app with Scryfall, EDHREC, Commander Spellbook and Archidekt data, printing and sync"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "pillow>=10",
]

[project.optional-dependencies]
gui = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    # real terminal for the MPC Autofill tool (its menus need a console): ConPTY on Windows, pty elsewhere
    "pywinpty>=2; sys_platform == 'win32'",
    "ptyprocess>=0.7; sys_platform != 'win32'",
    "segno>=1.6",  # QR code for pairing another device with the sync server
]
desktop = [
    "pyinstaller>=6.10",  # folder build of the desktop backend (desktop/sidecar/backend.spec)
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx2>=2.13",  # the TestClient prefers it; the sync-server image test blocks httpx itself
    "inquirerpy>=0.3",  # tests drive the same interactive menu the MPC Autofill tool shows
    "numpy>=1.24",  # synthetic halftone test images
]

[project.scripts]
mtg-gui = "mtgdeck.launch:main"
mtg-sync-server = "mtgdeck.sync.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mtgdeck"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
