# SonarQube Cloud: bugs, code smells, duplication and test coverage over Python, JavaScript, HTML/CSS and the
# Rust shell, with SonarQube Cloud's quality gate on new code. Free for public repositories. Settings live in
# sonar-project.properties; the token is the repository secret SONAR_TOKEN (also a Dependabot secret, because
# Dependabot runs get no repository secrets). The job fails when the quality gate fails, so the master ruleset
# can require the check `sonarqube`. Automatic Analysis must stay off in SonarQube Cloud, or the two clash.
name: SonarQube Cloud

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: sonarcloud-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  sonarqube:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # blame data for "new code"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --all-extras
      - name: Tests with coverage
        run: uv run pytest -q --cov=mtgdeck --cov-report=xml:coverage.xml
      - name: Scan
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300
