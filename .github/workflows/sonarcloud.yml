# SonarQube Cloud: bugs, code smells, duplication and test coverage over Python, JavaScript, HTML/CSS and the
# Rust shell, with SonarQube Cloud's quality gate on new code. Free for public repositories. Settings live in
# sonar-project.properties; the token is the repository secret SONAR_TOKEN (also a Dependabot secret, because
# Dependabot runs get no repository secrets). The job fails when the quality gate fails, so the master ruleset
# can require the check `sonarqube`. Automatic Analysis must stay off in SonarQube Cloud, or the two clash.
name: SonarQube Cloud

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: sonarcloud-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  sonarqube:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # blame data for "new code"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --all-extras
      - name: Tests with coverage
        run: uv run pytest -q --cov=mtgdeck --cov-report=xml:coverage.xml
      - name: Scan
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300

  # Claude's security review (check `claude`, required by the master ruleset) costs tokens, so it waits for
  # the quality gate (whose job runs the tests too). When that is not green the job still runs, but fails at
  # once without calling Claude: a required check that is skipped would count as passed. Re-running the failed jobs after a fix runs both again.
  claude:
    needs: sonarqube
    if: ${{ always() && github.event_name != 'push' }}
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Wait for the quality gate
        if: needs.sonarqube.result != 'success'
        run: |
          echo "::error::The SonarQube quality gate is not green (${{ needs.sonarqube.result }}), so the security review did not run. Fix that first."
          exit 1
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
      # The action's API check (used only by its false-positive filter) still calls the retired
      # claude-3-5-haiku-20241022; the 404 turns that filter off. Point it at a current model in the pinned copy.
      # Fails when the line is gone, so an action update without the bug gets noticed and this step removed.
      - name: Fix retired model in the action
        run: |
          f="${{ runner.workspace }}/../_actions/anthropics/claude-code-security-review/0c6a49f1fa56a1d472575da86a94dbc1edb78eda/claudecode/claude_api_client.py"
          grep -q 'claude-3-5-haiku-20241022' "$f"
          sed -i 's/claude-3-5-haiku-20241022/claude-haiku-5-5/' "$f"
      - name: Review
        id: review
        uses: anthropics/claude-code-security-review@0c6a49f1fa56a1d472575da86a94dbc1edb78eda # main, 2026-02-11
        with:
          claude-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude-model: claude-sonnet-5-5
          run-every-commit: true
          exclude-directories: "src/mtgdeck/gui/static/vendor,src/mtgdeck/sync/app/vendor"
          custom-security-scan-instructions: ${{ github.workspace }}/.github/security-review.txt
      - name: Verdict
        env:
          RESULTS: ${{ github.workspace }}/claudecode-results.json
        run: |
          if [ ! -s "$RESULTS" ]; then echo "::error::The security review produced no result."; exit 1; fi
          if jq -e '.error' "$RESULTS" >/dev/null; then echo "::error::The security review failed: $(jq -r '.error' "$RESULTS")"; exit 1; fi
          n=$(jq '.findings // [] | length' "$RESULTS")
          if [ "$n" -gt 0 ]; then
            jq -r '.findings[] | "::error file=\(.file // ""),line=\(.line // 1)::\(.severity // "?"): \(.description // .title // "finding")"' "$RESULTS" || true
            echo "::error::$n security finding(s). Fix them, or merge with the admin bypass if they are false positives."
            exit 1
          fi
          echo "No security findings."
