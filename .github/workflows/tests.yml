# The test suite (offline, no network) on every pull request and on master. No path filter on purpose:
# this check is required by the master ruleset, and a required check that never starts blocks the PR.
name: Tests

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --all-extras
      - name: Tests
        run: uv run pytest -q
